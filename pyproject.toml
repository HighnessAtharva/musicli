[tool.poetry]
name = "musicli"
version = "2.0.0"
description = "AI-powered music ratings, tier lists, and reviews from your terminal"
authors = [
    "Atharva Shah <highnessatharva@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["music", "cli", "terminal", "ratings", "tier-list", "lastfm", "ai", "spotify"]

documentation = "https://HighnessAtharva.github.io/musicli"
homepage = "https://HighnessAtharva.github.io/musicli"
repository = "https://github.com/HighnessAtharva/musicli"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

packages = [
    { include = "musicli", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10, <4.0"
pylast = ">=5.3"
rich = ">=13.9"
pillow = ">=11.0"
typer = {version = ">=0.12", extras = ["all"]}
questionary = ">=2.0"
httpx = ">=0.27"
python-dotenv = ">=1.0"
platformdirs = ">=4.2"

[tool.poetry.extras]
ai = ["openai"]
spotify = ["spotipy"]
all = ["openai", "spotipy"]

[tool.poetry.dev-dependencies]
autoflake = "*"
black = "*"
flake8 = "*"
flake8-bugbear = "*"
flake8-builtins = "*"
flake8-comprehensions = "*"
flake8-debugger = "*"
flake8-eradicate = "*"
flake8-logging-format = "*"
isort = "*"
mkdocstrings = {version = ">=0.18", extras = ["python"]}
mkdocs-material = "*"
mypy = "*"
pep8-naming = "*"
pre-commit = "*"
pymdown-extensions = "*"
pytest = "*"
pytest-github-actions-annotate-failures = "*"
pytest-cov = "*"
python-kacl = "*"
pyupgrade = "*"
tryceratops = "*"
openai = "*"

[tool.poetry.scripts]
musicli = "musicli.cli:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.pytest.ini_options]
addopts = """\
    --cov=src/musicli \
    --cov-report=term-missing \
    --cov-report=xml \
    --no-cov-on-fail \
"""
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 50
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover',
    'raise SystemExit',
    'raise NotImplementedError',
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
show_error_codes = true
