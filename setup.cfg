[flake8]
ignore =
    # Line break occurred before a binary operator (W503)
    W503,
    # Line too long (E501)
    E501,
    # flake8-builtins
    A003,
    # flake8-bugbear
    B008,

# pep8-naming
classmethod-decorators =
  classmethod,
  validator,
  root_validator,

enable-extensions=
    G,

per-file-ignores =
    */__init__.py: F401

max-complexity = 12

exclude = .git,__pycache__,old,build,dist,.venv,.eggs,.tox,src/musicli/musicli.py
